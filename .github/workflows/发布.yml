name: Build and Release Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 and arm64
            id: windows
            os: windows-latest
            platform: windows
          - name: Linux x64 and arm64
            id: linux
            os: ubuntu-latest
            platform: linux
          - name: macOS x64 and arm64
            id: macos
            os: macos-latest
            platform: macos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          node -e "const p=require('./package.json'); const tag=process.env.GITHUB_REF_NAME; if (tag !== 'v' + p.version) { throw new Error('Tag ' + tag + ' does not match package.json version ' + p.version) }"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if ($env:WINDOWS_CSC_LINK) {
            $env:CSC_LINK = $env:WINDOWS_CSC_LINK
            $env:CSC_KEY_PASSWORD = $env:WINDOWS_CSC_KEY_PASSWORD
          }
          pnpm run dist:win
        env:
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

      - name: Build Linux installers
        if: matrix.platform == 'linux'
        run: pnpm run dist:linux

      - name: Build macOS installers
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          if [[ -n "$MACOS_CSC_LINK" ]]; then
            export CSC_LINK="$MACOS_CSC_LINK"
            export CSC_KEY_PASSWORD="$MACOS_CSC_KEY_PASSWORD"
            export APPLE_ID="$MACOS_APPLE_ID"
            export APPLE_APP_SPECIFIC_PASSWORD="$MACOS_APPLE_APP_SPECIFIC_PASSWORD"
            export APPLE_TEAM_ID="$MACOS_APPLE_TEAM_ID"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          pnpm run dist:mac
        env:
          MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          MACOS_APPLE_ID: ${{ secrets.APPLE_ID }}
          MACOS_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MACOS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.id }}
          path: |
            release/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux artifacts
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.id }}
          path: |
            release/*.deb
            release/*.rpm
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.id }}
          path: |
            release/*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          cat > release-notes.md <<EOF
          Apex SSH ${GITHUB_REF_NAME} —— 简洁、现代的跨平台桌面 SSH 客户端：终端连接、多会话管理与 SFTP 文件传输。

          ## 下载安装

          | 平台 | 架构 | 安装包 |
          | --- | --- | --- |
          | 🪟 Windows | x64 | [Apex-SSH-${VERSION}-Windows-x64-Setup.exe](${BASE}/Apex-SSH-${VERSION}-Windows-x64-Setup.exe) |
          | 🪟 Windows | arm64 | [Apex-SSH-${VERSION}-Windows-arm64-Setup.exe](${BASE}/Apex-SSH-${VERSION}-Windows-arm64-Setup.exe) |
          | 🍎 macOS | Apple Silicon | [Apex-SSH-${VERSION}-macOS-arm64.dmg](${BASE}/Apex-SSH-${VERSION}-macOS-arm64.dmg) |
          | 🍎 macOS | Intel | [Apex-SSH-${VERSION}-macOS-x64.dmg](${BASE}/Apex-SSH-${VERSION}-macOS-x64.dmg) |
          | 🐧 Linux (Debian/Ubuntu) | x64 | [Apex-SSH-${VERSION}-Linux-DEB-x64.deb](${BASE}/Apex-SSH-${VERSION}-Linux-DEB-x64.deb) |
          | 🐧 Linux (Debian/Ubuntu) | arm64 | [Apex-SSH-${VERSION}-Linux-DEB-arm64.deb](${BASE}/Apex-SSH-${VERSION}-Linux-DEB-arm64.deb) |
          | 🐧 Linux (Fedora/RHEL) | x64 | [Apex-SSH-${VERSION}-Linux-RPM-x64.rpm](${BASE}/Apex-SSH-${VERSION}-Linux-RPM-x64.rpm) |
          | 🐧 Linux (Fedora/RHEL) | arm64 | [Apex-SSH-${VERSION}-Linux-RPM-arm64.rpm](${BASE}/Apex-SSH-${VERSION}-Linux-RPM-arm64.rpm) |

          > **提示**：当前公开安装包尚未配置商业代码签名，首次运行时操作系统可能显示安全提示（Windows 选择「仍要运行」，macOS 在「系统设置 → 隐私与安全性」中允许）。
          EOF
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="${GITHUB_REF_NAME}" --jq .body \
            | sed -e "s/## What's Changed/## 版本变更/" \
                  -e "s/\*\*Full Changelog\*\*/\*\*完整变更记录\*\*/" >> release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          body_path: release-notes.md
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
