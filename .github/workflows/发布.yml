name: Build and Release Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            id: windows-x64
            os: windows-latest
            platform: windows
          - name: Linux x64
            id: linux-x64
            os: ubuntu-latest
            platform: linux
          - name: macOS x64 and arm64
            id: macos
            os: macos-latest
            platform: macos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          node -e "const p=require('./package.json'); const tag=process.env.GITHUB_REF_NAME; if (tag !== 'v' + p.version) { throw new Error('Tag ' + tag + ' does not match package.json version ' + p.version) }"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if ($env:WINDOWS_CSC_LINK) {
            $env:CSC_LINK = $env:WINDOWS_CSC_LINK
            $env:CSC_KEY_PASSWORD = $env:WINDOWS_CSC_KEY_PASSWORD
          }
          pnpm run dist:win
        env:
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

      - name: Build Linux installers
        if: matrix.platform == 'linux'
        run: pnpm run dist:linux

      - name: Build macOS installers
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          if [[ -n "$MACOS_CSC_LINK" ]]; then
            export CSC_LINK="$MACOS_CSC_LINK"
            export CSC_KEY_PASSWORD="$MACOS_CSC_KEY_PASSWORD"
            export APPLE_ID="$MACOS_APPLE_ID"
            export APPLE_APP_SPECIFIC_PASSWORD="$MACOS_APPLE_APP_SPECIFIC_PASSWORD"
            export APPLE_TEAM_ID="$MACOS_APPLE_TEAM_ID"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          pnpm run dist:mac
        env:
          MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          MACOS_APPLE_ID: ${{ secrets.APPLE_ID }}
          MACOS_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MACOS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: |
            release/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux artifacts
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
